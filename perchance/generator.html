<!-- Paste this into your generator's HTML editor (middle button: "html"), replacing everything there. -->
<style>
  body { margin: 0; background: transparent; font-family: system-ui, sans-serif; }
  #out { width: 100%; position: relative; }
  /* v0.2.6: fill the width but keep the image's own shape (was width-only, which stretched images) */
  #out iframe, #out img, #out canvas { display: block; width: 100% !important; height: auto !important; aspect-ratio: var(--ar, 1 / 1) !important; }
  #wait { color: #888; padding: 12px; font-size: 13px; }
  .car { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .car::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; scroll-snap-align: center; }
  .count { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 2; pointer-events: none;
           background: rgba(0,0,0,.6); color: #fff; font-size: 13px; padding: 2px 10px; border-radius: 10px; }
  .arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; border: 0; width: 34px; height: 34px;
           border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; font-size: 20px; line-height: 34px; padding: 0; cursor: pointer; }
  .prev { left: 6px; } .next { right: 6px; }
</style>
<div id="out"><div id="wait">Waiting for a prompt from Claude <small>(generator v0.2.8)</small>… <button id="test">test image</button> <button id="test4">test 4</button> <button id="testref">test ref</button></div></div>
<script>
  // Receives prompts from the Claude Perchance browser extension and renders them with
  // Perchance's text-to-image-plugin. Several images per prompt show as a swipeable carousel.
  let currentId = null;

  function tellAncestors(msg) {
    let w = window;
    for (let i = 0; i < 5 && w !== w.parent; i++) { w = w.parent; try { w.postMessage(msg, "*"); } catch (e) {} }
  }

  // v0.2.5: send finished images up to the extension (for its full-size viewer and Save button).
  function sendImage(id, index, data) {
    let url = data && (data.dataUrl || (data.canvas && data.canvas.toDataURL && (() => { try { return data.canvas.toDataURL("image/jpeg", 0.95); } catch (e) { return null; } })()));
    if (typeof url === "string" && url.startsWith("data:image/")) tellAncestors({ type: "claude-perchance:image", id, index, dataUrl: url });
  }
  function watch(id, index, result) {
    if (result && typeof result.then === "function") result.then((r) => sendImage(id, index, r)).catch(() => {});
  }

  // Test buttons: a random sci-fi or fantasy anime scene each time (v0.2.7; was a red fox).
  const TESTS = [
    { resolution: "768x512", prompt: "A young woman pilot in a white and orange flight suit stands on the rain-slick deck of a floating sky fortress at sunset, her hair whipping in the wind, giant airships drifting between towering clouds behind her. Anime style, cel-shaded, clean line art, dramatic golden backlight, rich detailed background." },
    { resolution: "512x768", prompt: "A silver-haired elf mage in flowing midnight-blue robes raises a glowing staff inside a vast ruined cathedral overgrown with luminous blue flowers, shafts of moonlight falling through the broken stained-glass windows. Anime style, cel-shaded, clean line art, soft magical glow, highly detailed." },
    { resolution: "768x512", prompt: "A neon-lit cyberpunk street market at night in heavy rain, a teenage hacker in a yellow hooded jacket walking past holographic signs and noodle stalls, flying cars streaking overhead between skyscrapers. Anime style, cel-shaded, clean line art, vivid pink and cyan neon reflections on wet pavement." },
    { resolution: "512x768", prompt: "A towering battle mech in white and red armour kneels in a field of tall grass beside its young pilot, a girl with a red scarf looking up at it, a giant ringed planet rising in the evening sky. Anime style, cel-shaded, clean line art, warm sunset light, detailed and cinematic." },
    { resolution: "768x512", prompt: "A dragon rider in bronze armour soars on a jade-green dragon over a fantasy city of white towers and waterfalls built on the side of a cliff, flocks of birds below, bright morning sun. Anime style, cel-shaded, clean line art, epic wide view, highly detailed." },
    { resolution: "768x512", prompt: "A lone samurai in dark armour stands on a stone bridge on a misty alien world with two moons, glowing jellyfish-like creatures floating through the air around cherry trees with crystal blossoms. Anime style, cel-shaded, clean line art, cool blue and pink lighting, serene and detailed." },
  ];
  const pickTest = () => TESTS[Math.floor(Math.random() * TESTS.length)];
  document.querySelector("#test").onclick = () => render({ id: "test-" + Date.now(), ...pickTest() });
  document.querySelector("#test4").onclick = () => render({ id: "test4-" + Date.now(), ...pickTest(), count: 4 });

  // v0.2.8: same scene twice, with and without a reference image, to see whether the reference does anything.
  const REF_TEST = "https://raw.githubusercontent.com/purdygeorgeedward-dev/Claude-Perchance/main/test-assets/reference.jpg";
  document.querySelector("#testref").onclick = () => render({ id: "testref-" + Date.now(), resolution: "512x512", seed: 12345,
    prompt: "An anime-style portrait of a young adventurer, cel-shaded, clean line art, detailed", ref: REF_TEST, blur: 0.3 });

  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "claude-perchance:render" || typeof d.prompt !== "string") return;
    render(d);
  });

  // v0.2.8: reference image ("| ref: https://... | blur: 0.3" in a tag). Perchance's text-to-image plugin
  // takes referenceImage: { url, blur }; it may be switched off on Perchance's side, in which case it's ignored.
  function addRef(opts, d) {
    if (typeof d.ref === "string" && /^https:\/\//.test(d.ref)) {
      opts.referenceImage = { url: d.ref };
      if (typeof d.blur === "number" && d.blur >= 0 && d.blur <= 1) opts.referenceImage.blur = d.blur;
    }
  }

  function render(d) {
    tellAncestors({ type: "claude-perchance:ack", id: d.id });
    if (d.id === currentId) return;
    currentId = d.id;
    const n = Math.min(8, Math.max(1, Number(d.count) || 1));
    const out = document.querySelector("#out");
    const [rw, rh] = String(d.resolution || "512x512").split("x").map(Number);
    out.style.setProperty("--ar", (rw > 0 && rh > 0) ? rw + " / " + rh : "1 / 1");
    // One image: exactly the v0.1.5 code that worked, with no carousel wrapper around it (v0.2.1 fix).
    if (n < 2) {
      const opts = {
        prompt: d.prompt,
        negativePrompt: d.negative || "",
        resolution: d.resolution || "512x512",
        onFinish: (data) => { tellAncestors({ type: "claude-perchance:done", id: d.id }); sendImage(d.id, 0, data); },
      };
      if (typeof d.seed === "number") opts.seed = d.seed;
      if (typeof d.guidance === "number") opts.guidanceScale = d.guidance;
      addRef(opts, d);
      const result = image(opts);
      out.innerHTML = result;
      watch(d.id, 0, result);
      return;
    }
    // Several images: carousel (v0.2.0).
    out.innerHTML = "";
    const car = document.createElement("div");
    car.className = "car";
    out.appendChild(car);
    let done = false;
    for (let i = 0; i < n; i++) {
      const opts = {
        prompt: d.prompt,
        negativePrompt: d.negative || "",
        resolution: d.resolution || "512x512",
        onFinish: (data) => { sendImage(d.id, i, data); if (!done) { done = true; tellAncestors({ type: "claude-perchance:done", id: d.id }); } },
      };
      // A fixed seed gives a run of neighbouring seeds, so each slide differs but stays reproducible.
      if (typeof d.seed === "number" && d.seed >= 0) opts.seed = d.seed + i;
      if (typeof d.guidance === "number") opts.guidanceScale = d.guidance;
      addRef(opts, d);
      const slide = document.createElement("div");
      slide.className = "slide";
      car.appendChild(slide); // attach first, so the plugin's output lands in the live page (v0.2.2)
      const result = image(opts);
      slide.innerHTML = result;
      watch(d.id, i, result);
    }
    // if (n < 2) return; // v0.2.0; one image now returns early above
    const count = document.createElement("div");
    count.className = "count";
    const prev = document.createElement("button");
    prev.className = "arrow prev"; prev.textContent = "‹";
    const next = document.createElement("button");
    next.className = "arrow next"; next.textContent = "›";
    out.append(count, prev, next);
    const at = () => Math.round(car.scrollLeft / car.clientWidth);
    const show = () => { count.textContent = (at() + 1) + " / " + n; };
    const go = (k) => car.scrollTo({ left: Math.max(0, Math.min(n - 1, at() + k)) * car.clientWidth, behavior: "smooth" });
    prev.onclick = () => go(-1);
    next.onclick = () => go(1);
    car.addEventListener("scroll", show, { passive: true });
    show();
  }

  // Let the extension know we're ready (it also polls, so this is just a speed-up).
  tellAncestors({ type: "claude-perchance:ready" });
</script>
