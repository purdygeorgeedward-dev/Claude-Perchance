<!-- Paste this into your generator's HTML editor (middle button: "html"), replacing everything there. -->
<style>
  body { margin: 0; background: transparent; font-family: system-ui, sans-serif; }
  #out { width: 100%; }
  #out iframe { width: 100% !important; }
  #wait { color: #888; padding: 12px; font-size: 13px; }
</style>
<div id="out"><div id="wait">Waiting for a prompt from Claude… <button id="test">test image</button></div></div>
<script>
  // Receives prompts from the Claude Perchance browser extension and renders them
  // with Perchance's text-to-image-plugin.
  let currentId = null;

  function tellAncestors(msg) {
    let w = window;
    for (let i = 0; i < 5 && w !== w.parent; i++) { w = w.parent; try { w.postMessage(msg, "*"); } catch (e) {} }
  }

  // "test image" button: checks the image plugin works, without the extension.
  document.querySelector("#test").onclick = () =>
    render({ id: "test", prompt: "a red fox sitting in fresh snow, golden hour, detailed digital painting" });

  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "claude-perchance:render" || typeof d.prompt !== "string") return;
    render(d);
  });

  function render(d) {
    tellAncestors({ type: "claude-perchance:ack", id: d.id });
    if (d.id === currentId) return;
    currentId = d.id;
    const opts = {
      prompt: d.prompt,
      negativePrompt: d.negative || "",
      resolution: d.resolution || "512x512",
      onFinish: () => tellAncestors({ type: "claude-perchance:done", id: d.id }),
    };
    if (typeof d.seed === "number") opts.seed = d.seed;
    if (typeof d.guidance === "number") opts.guidanceScale = d.guidance;
    document.querySelector("#out").innerHTML = image(opts);
  }

  // Let the extension know we're ready (it also polls, so this is just a speed-up).
  tellAncestors({ type: "claude-perchance:ready" });
</script>
